name: Firmware CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned build and test tools
        run: python -m pip install -r requirements-dev.txt

      - name: Test timer contract
        run: pytest -q

      - name: Build Ulanzi TC001 firmware
        run: pio run --environment ulanzi

      - name: Validate application image
        run: python scripts/check_firmware.py .pio/build/ulanzi/firmware.bin

      - name: Upload application image
        uses: actions/upload-artifact@v4
        with:
          name: ulanzi-tc001-arcade-firmware
          path: .pio/build/ulanzi/firmware.bin
          if-no-files-found: error
